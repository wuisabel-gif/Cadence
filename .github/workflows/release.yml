name: Release

# Push a v* tag on the approved release commit. This checks the tree, publishes
# to npm with provenance through npm trusted publishing (no token stored here),
# creates the GitHub release from docs/releases/<tag>.md, and confirms the
# registry serves the new version. Then it builds the desktop app for macOS,
# Windows, and Linux and attaches the installers to that release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Release notes exist
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"

      - name: Release check
        run: npm run release:check

      - name: Detector copies are current
        run: |
          npm run build:extension && npm run build:vscode
          git diff --exit-code extension/detector.js integrations/vscode/detector.js

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Relative doc links only work in the repo, so point them at the tag.
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          sed -E -e "s#\]\(\.\./\.\./#](${base}/#g" -e "s#\]\(\.\./#](${base}/docs/#g" \
            "docs/releases/$GITHUB_REF_NAME.md" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # The registry can lag a few minutes behind a successful publish.
      - name: Registry serves the new version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            got=$(npm view cadence-deslop@"$want" version 2>/dev/null || true)
            [ "$got" = "$want" ] && echo "npm serves $got" && exit 0
            sleep 30
          done
          echo "npm did not serve $want within 10 minutes" >&2
          exit 1

  desktop:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux webview libraries
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Builds are unsigned; desktop/README.md explains the first-launch prompt.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.1
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
